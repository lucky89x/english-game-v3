# English Quest room server: a Cloudflare Worker (free plan). Deployed by .github/workflows/room-server.yml,
# or by hand from this folder: npx wrangler deploy
name = "english-quest-room"
main = "room.js"
compatibility_date = "2025-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# The free plan needs SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
