<!doctype html><meta charset="utf-8"><title>Model sheet</title>
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.min.js", "three/addons/": "../../vendor/addons/" } }</script>
<body style="margin:0;background:transparent"><canvas id="c"></canvas>
<script type="module">
// Contact sheet of models: ?files=fishing/fish_carp,prop_boat_v01&cols=5&cell=240&yaw=0.6   (paths under assets/models, no extension)
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search), files = (q.get('files') || '').split(',').filter(Boolean), cols = +(q.get('cols') || 5), cell = +(q.get('cell') || 240), yaw = +(q.get('yaw') || 0.6), pitch = +(q.get('pitch') || 0.35);
const rows = Math.ceil(files.length / cols), W = cols * cell, H = rows * cell, canvas = document.getElementById('c'); canvas.width = W; canvas.height = H;
const alpha = q.get('alpha') === '1', r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha, preserveDrawingBuffer: true }); r.setClearColor(0, 0); r.setSize(W, H, false); r.autoClear = false; r.setScissorTest(true); r.outputColorSpace = THREE.SRGBColorSpace;
const L = new GLTFLoader(), info = {};
for (let i = 0; i < files.length; i++) {
  const g = await L.loadAsync(`../../assets/models/${files[i]}.glb`), sc = new THREE.Scene(); if (!alpha) sc.background = new THREE.Color(0xe8e0d0);
  sc.add(new THREE.HemisphereLight(0xffffff, 0x8a7a66, 1.6)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(3, 6, 4); sc.add(d);
  const box = new THREE.Box3().setFromObject(g.scene), size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3()), rad = size.length() / 2 || 1;
  info[files[i]] = { size: size.toArray().map((v) => +v.toFixed(2)), tris: 0, anims: g.animations.map((a) => a.name) }; g.scene.traverse((o) => { if (o.isMesh) info[files[i]].tris += o.geometry.index ? o.geometry.index.count / 3 : 0; });
  sc.add(g.scene); const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 100), dist = rad / Math.tan(15 * Math.PI / 180) * 1.05;
  cam.position.set(ctr.x + Math.sin(yaw) * Math.cos(pitch) * dist, ctr.y + Math.sin(pitch) * dist, ctr.z + Math.cos(yaw) * Math.cos(pitch) * dist); cam.lookAt(ctr);
  const x = (i % cols) * cell, y = H - (Math.floor(i / cols) + 1) * cell; r.setViewport(x, y, cell, cell); r.setScissor(x, y, cell, cell); r.clear(); r.render(sc, cam);
}
window.INFO = info; window.DONE = true;
</script>
